# logstash/pipeline/logstash.conf

input {
  gelf {
    port => 12201
    type => "docker"
  }
  
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON from GELF message field only for log-generator
  # Parse JSON from Beats input
  if [type] == "filebeat" {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Move parsed fields to root
    if [parsed] {
      ruby {
        code => "
          event.get('parsed').each {|k, v|
            event.set(k, v)
          }
        "
        remove_field => ["parsed"]
      }
    }
  }
  
  # Parse JSON from GELF input (traffic generator)
  if [type] == "docker" and [tag] == "traffic-generator" {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Move parsed fields to root
    if [parsed] {
      ruby {
        code => "
          event.get('parsed').each {|k, v|
            event.set(k, v)
          }
        "
        remove_field => ["parsed"]
      }
    }
  }
  
  # Tag logs based on their source
  if [log_type] == "user_database" {
    mutate {
      add_tag => ["user_database"]
    }
  } else if [type] == "docker" and [tag] == "traffic-generator" {
    mutate {
      add_tag => ["webapp"]
    }
  }

  # Only process useragent if the field exists (webapp logs)
  if [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent][parsed]"
      remove_field => "[user_agent][original]"
    }
  }

  # Only process geoip if client_ip exists (webapp logs)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "[client][geo]"
    }
  }
  
  # Handle timestamp from parsed logs
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
  
  # Handle assigned_at timestamp for server assignments
  if [assigned_at] {
    date {
      match => [ "assigned_at", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  # Route to different indices based on log type
  if [log_type] == "user_database" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "user-database-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "server_assignment" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "server-assignment-logs-%{+YYYY.MM.dd}"
    }
  } else if "webapp" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "webapp-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-%{+YYYY.MM.dd}"
    }
  }
  
  stdout {
    codec => rubydebug
  }
}