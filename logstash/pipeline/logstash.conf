# logstash/pipeline/logstash.conf

input {
  gelf {
    port => 12201
    type => "docker"
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  useragent {
    source => "[user_agent][original]"
    target => "[user_agent][parsed]"
    remove_field => "[user_agent][original]"
  }

  # --- FIX IS HERE ---
  # We now explicitly tell the filter where to store the geoip data.
  geoip {
    source => "client_ip"
    target => "[client][geo]"
  }
  
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "webapp-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}