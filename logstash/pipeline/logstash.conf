# logstash/pipeline/logstash.conf

input {
  gelf {
    port => 12201
    type => "docker"
  }
  
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON from GELF message field only for log-generator
  if [type] == "docker" and [tag] == "log-generator" {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Promote parsed fields to root level
    if [parsed] {
      ruby {
        code => "
          parsed = event.get('parsed')
          if parsed.is_a?(Hash)
            parsed.each { |k, v| event.set(k, v) }
          end
        "
      }
      mutate {
        remove_field => ["parsed"]
      }
    }
  }

  # Tag logs based on their source
  if [log_type] == "user_database" {
    mutate {
      add_tag => ["user_database"]
    }
  } else if [type] == "docker" and [tag] == "log-generator" {
    mutate {
      add_tag => ["webapp"]
    }
  }

  # Only process useragent if the field exists (webapp logs)
  if [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent][parsed]"
      remove_field => "[user_agent][original]"
    }
  }

  # Only process geoip if client_ip exists (webapp logs)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "[client][geo]"
    }
  }
  
  # Handle timestamp from parsed logs
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
}

output {
  # Route to different indices based on log type
  if "user_database" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "user-database-logs-%{+YYYY.MM.dd}"
    }
  } else if "webapp" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "webapp-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "other-logs-%{+YYYY.MM.dd}"
    }
  }
  
  stdout {
    codec => rubydebug
  }
}