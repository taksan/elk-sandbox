# logstash/pipeline/logstash.conf

input {
  gelf {
    port => 12201
    type => "docker"
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON from GELF message field only for log-generator
  if [type] == "docker" and [tag] == "log-generator" {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Promote parsed fields to root level
    if [parsed] {
      ruby {
        code => "
          parsed = event.get('parsed')
          if parsed.is_a?(Hash)
            parsed.each { |k, v| event.set(k, v) }
          end
        "
      }
      mutate {
        remove_field => ["parsed"]
      }
    }
  }

  # Only process useragent if the field exists
  if [user_agent][original] {
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent][parsed]"
      remove_field => "[user_agent][original]"
    }
  }

  # Only process geoip if client_ip exists
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "[client][geo]"
    }
  }
  
  # Handle timestamp from parsed logs
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "webapp-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}