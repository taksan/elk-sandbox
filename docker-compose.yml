# docker-compose.yml
include:
  - path: fake-traffic-generator/docker-compose.yml
    env_file: .env


services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elk_net
    # --- ADD THIS HEALTHCHECK ---
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044/tcp"
      - "9600:9600"
      - "12201:12201/udp"
    # --- UPDATE depends_on ---
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    # --- UPDATE depends_on ---
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - traffic_generator_logs:/var/log/traffic-generator:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started
      user-database:
        condition: service_started
      server-assignment:
        condition: service_started
    networks:
      - elk_net
    command: filebeat -e -strict.perms=false

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.12.2
    container_name: metricbeat
    user: root
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
      - metricbeat_data:/usr/share/metricbeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_net
    command: metricbeat -e -strict.perms=false -system.hostfs=/hostfs

networks:
  elk_net:
    driver: bridge

volumes:
  es_data:
    driver: local
  filebeat_data:
    driver: local
  metricbeat_data:
    driver: local