# docker-compose.yml
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elk_net
    # --- ADD THIS HEALTHCHECK ---
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044/tcp"
      - "9600:9600"
      - "12201:12201/udp"
    # --- UPDATE depends_on ---
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    # --- UPDATE depends_on ---
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk_net

  traffic-generator:
    build:
      context: ./traffic-generator
      dockerfile: Dockerfile
    container_name: traffic_generator
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ./user_flows.yml:/app/user_flows.yml:ro
    # --- UPDATE depends_on ---
    # Traffic generator should wait for Logstash to be ready
    depends_on:
      logstash:
        condition: service_started # No healthcheck needed here, just start order
      user-database:
        condition: service_started
    networks:
      - elk_net
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "traffic-generator"

  user-database:
    build:
      context: ./user-database
      dockerfile: Dockerfile
    container_name: user_database
    restart: on-failure
    ports:
      - "8500:8500"
    volumes:
      - user_data:/data
    networks:
      - elk_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  server-assignment:
    build:
      context: ./server-assignment
      dockerfile: Dockerfile
    container_name: server_assignment
    restart: on-failure
    ports:
      - "8100:8100"
    volumes:
      - ./geo_servers.geojson:/app/geo_servers.geojson:ro
      - server_assignment_logs:/var/log/server-assignment
    networks:
      - elk_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - user_data:/data:ro
      - server_assignment_logs:/var/log/server-assignment:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started
      user-database:
        condition: service_started
      server-assignment:
        condition: service_started
    networks:
      - elk_net
    command: filebeat -e -strict.perms=false

networks:
  elk_net:
    driver: bridge

volumes:
  es_data:
    driver: local
  user_data:
    driver: local
  server_assignment_logs:
    driver: local
  filebeat_data:
    driver: local